<nav class="bg-neutral-900/90 backdrop-blur-2xl border-b border-white/10 sticky top-0 z-50 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">

        <!-- Logo / Brand -->
        <a href="{% url 'home' %}" class="text-2xl font-serif font-bold text-amber-500 hover:text-white transition duration-200 tracking-tight flex items-center gap-2">
            <span>Urban Palate</span>
        </a>

        <!-- Desktop Navigation -->
        <div class="hidden md:flex space-x-8 items-center">
            <a href="{% url 'menu:menu_list' %}" class="text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-[11px] transition duration-200">Menu</a>
            <a href="{% url 'orders:cart' %}" class="text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-[11px] transition duration-200">Cart</a>
            <a href="{% url 'reservations:new_reservation' %}" class="text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-[11px] transition duration-200">Reserve</a>

            {% if user %}
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}" class="text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-[11px] transition duration-200">Profile</a>

                    <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit"
                                class="bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] font-black uppercase tracking-widest px-4 py-2.5 rounded-xl hover:bg-red-500 hover:text-white transition duration-300 shadow-lg">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-[11px] transition duration-200">Login</a>
                    <a href="{% url 'accounts:register' %}"
                       class="bg-amber-500 text-black text-[10px] font-black uppercase tracking-widest px-5 py-2.5 rounded-xl hover:bg-amber-400 transition duration-300 shadow-[0_0_20px_rgba(245,158,11,0.2)]">
                        Register
                    </a>
                {% endif %}
            {% endif %}
        </div>

        <!-- Mobile Menu Button (Hamburger) -->
        <button id="mobile-menu-button" class="md:hidden text-amber-500 focus:outline-none bg-neutral-800/80 border border-white/10 p-2.5 rounded-xl hover:bg-neutral-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>

    <!-- Mobile Menu Dropdown -->
    <div id="mobile-menu" class="hidden md:hidden px-6 py-6 space-y-4 bg-neutral-900/95 border-b border-white/10 backdrop-blur-2xl">
        <a href="{% url 'menu:menu_list' %}" class="block text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-xs transition duration-200">Menu</a>
        <a href="{% url 'orders:cart' %}" class="block text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-xs transition duration-200">Cart</a>
        <a href="{% url 'reservations:new_reservation' %}" class="block text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-xs transition duration-200">Reserve</a>

        {% if user %}
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}" class="block text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-xs transition duration-200">Profile</a>

                <form method="post" action="{% url 'accounts:logout' %}" class="block pt-2">
                    {% csrf_token %}
                    <button type="submit"
                            class="w-full text-center bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] font-black uppercase tracking-widest px-4 py-3 rounded-xl hover:bg-red-500 hover:text-white transition duration-300">
                        Logout
                    </button>
                </form>
            {% else %}
                <div class="pt-2 flex flex-col gap-3">
                    <a href="{% url 'accounts:login' %}" class="block text-center text-gray-300 hover:text-amber-500 font-bold uppercase tracking-widest text-xs py-2">Login</a>
                    <a href="{% url 'accounts:register' %}"
                       class="block text-center bg-amber-500 text-black text-[10px] font-black uppercase tracking-widest px-4 py-3 rounded-xl hover:bg-amber-400 transition duration-300 shadow-[0_0_20px_rgba(245,158,11,0.2)]">
                        Register
                    </a>
                </div>
            {% endif %}
        {% endif %}
    </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const button = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('mobile-menu');

    button.addEventListener('click', () => {
        menu.classList.toggle('hidden');
    });
});
</script>
